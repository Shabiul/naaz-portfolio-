<!doctype html>
<html lang="en" class="no-js" data-ui="skeuo">
  <head>
    <!--@include:head-->
    <title>Proof of Work — Naaz AI Labs, Bengaluru</title>
    <meta
      name="description"
      content="Live websites, CRMs and admin dashboards built by Naaz AI Labs for travel, hotels, clinics, events, real estate and more. Open any project's live site."
    />
    <meta property="og:title" content="Proof of Work — Naaz AI Labs, Bengaluru" />
    <meta property="og:description" content="Real businesses. Live websites. Every project links to the site it runs on." />
    <link rel="canonical" href="https://www.naazailabs.com/proof-of-work.html" />
    <meta property="og:url" content="https://www.naazailabs.com/proof-of-work.html" />
    <script type="module" src="/src/js/main.js"></script>
  </head>

  <body>
    <!--@include:nav-->

    <div class="page-enter is-ready" data-page>
      <main id="main">
        <header class="page-head">
          <div class="shell grid12">
            <div class="col-full md:col-8">
              <p class="page-head__index">Proof of Work · 04</p>
              <h1 class="page-head__title" style="margin-block-start:1.5rem" data-module="splitText">
                Real businesses. Live websites.
              </h1>
            </div>
            <p class="col-full md:col-4 md:start-9 lede" style="align-self:end" data-reveal="up">Real systems, running today.</p>
          </div>
        </header>

        <section class="section section--tight">
          <div class="shell" data-module="filter">
            <div class="filters" style="margin-block-end:clamp(2rem, 1rem + 3vw, 3.5rem)" data-reveal="fade">
              <!--@render:projectFilters-->
            </div>

            <p class="sr-only" role="status" aria-live="polite" data-filter-status></p>

            <div class="work-grid" data-filter-grid data-reveal-group>
              <!--@render:projects-->
            </div>

            <!-- Shown by filter.js when no project matches the active filters. -->
            <div data-filter-empty hidden>
              <p class="lede">
                No projects match these filters yet —
                <a class="link link--accent" href="/contact.html">talk to us about yours</a>.
              </p>
              <button class="btn btn--ghost" type="button" data-filter-reset style="margin-block-start:1.25rem">
                Clear filters
              </button>
            </div>
          </div>
        </section>

        <section class="section section--ruled">
          <!-- Decorative bonus only — the real link right below reaches
               /contact.html on its own, so this is excluded from tab order
               and hidden from assistive tech rather than duplicating it. -->
          <button
            class="spider"
            type="button"
            tabindex="-1"
            aria-hidden="true"
            data-module="spider"
            data-spider-link="/contact.html"
          >
            <svg viewBox="0 0 40 40" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <g class="spider__legs">
                <path d="M14 18c-4-1-7-3-9-6" />
                <path d="M14 22c-4 0-8 1-10 3" />
                <path d="M15 26c-3 2-6 5-7 8" />
                <path d="M17 29c-2 3-3 6-3 9" />
                <path d="M26 18c4-1 7-3 9-6" />
                <path d="M26 22c4 0 8 1 10 3" />
                <path d="M25 26c3 2 6 5 7 8" />
                <path d="M23 29c2 3 3 6 3 9" />
              </g>
              <ellipse cx="20" cy="23" rx="6" ry="7" fill="currentColor" stroke="none" />
              <circle cx="20" cy="13" r="3.4" fill="currentColor" stroke="none" />
              <circle cx="18.4" cy="12" r="0.9" fill="var(--color-ivory-200)" stroke="none" />
              <circle cx="21.6" cy="12" r="0.9" fill="var(--color-ivory-200)" stroke="none" />
            </svg>
          </button>

          <div class="shell grid12" style="align-items:center">
            <div class="col-full md:col-6">
              <p class="eyebrow" data-reveal="fade">Due diligence</p>
              <h2 class="title-1" style="margin-block-start:1.25rem" data-reveal="up">
                Want to speak to a client directly?
              </h2>
              <p class="lede" style="margin-block-start:1.5rem" data-reveal="up">We will introduce you to a client in your industry.</p>
            </div>
            <div class="col-full md:col-4 md:start-9" data-reveal="up">
              <a class="btn btn--lg" href="/contact.html">
                Request a reference
                <span class="btn__arrow" aria-hidden="true">→</span>
              </a>
            </div>
          </div>
        </section>
      </main>

      <!--@include:footer-->
    </div>
  </body>
</html>
